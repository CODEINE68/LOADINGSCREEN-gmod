<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AKH NRP — Chargement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Noto+Serif+JP:wght@700&display=swap">
<style>
:root{--red:#ff2a2a;--red2:#a30000;--ink:#0a0000;--txt:#f6e3e3;--dim:#b99494;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:'Oswald','Arial Narrow',Impact,sans-serif}
/* Scène 16:9 qui "couvre" l'écran (comme background-size:cover) : tout est positionné en % de la scène */
#stage{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%);overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 40s ease-in-out infinite alternate}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.045)}}
#petals{position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* Plaque qui recouvre la barre dessinée dans l’image de fond */
#plate{position:absolute;left:33.6%;top:81.6%;width:33.2%;height:6.4%;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at center,rgba(8,0,0,.97) 62%,rgba(8,0,0,0) 100%)}
#track{position:relative;width:78%;height:calc(var(--u)*1.25);border-radius:99px;border:calc(var(--u)*.14) solid #7a0b0b;background:#1a0303;overflow:hidden;box-shadow:0 0 calc(var(--u)*1.4) rgba(255,40,40,.45),inset 0 0 calc(var(--u)*.6) #000}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(180deg,#ff6a5a,#ff1f1f 45%,#a30000);box-shadow:0 0 calc(var(--u)*1.2) var(--red)}
#fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);background-size:200% 100%;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-100% 0}}
.swirl{position:absolute;top:50%;width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);transform:translateY(-50%);filter:drop-shadow(0 0 calc(var(--u)*.5) var(--red))}
.swirl.l{left:3%}.swirl.r{right:3%;transform:translateY(-50%) scaleX(-1)}

#status{position:absolute;left:0;right:0;top:88.6%;text-align:center;font-size:calc(var(--u)*1.35);letter-spacing:.14em;text-transform:uppercase;font-weight:500;text-shadow:0 0 calc(var(--u)*.8) #000,0 0 calc(var(--u)*1.6) rgba(255,30,30,.6)}
#status b{color:var(--red);font-weight:600}
#file{position:absolute;left:20%;right:20%;top:92.2%;text-align:center;font-size:calc(var(--u)*.95);color:var(--dim);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 6px #000}

#tip{position:absolute;left:12%;right:12%;top:95.2%;display:flex;gap:calc(var(--u)*.8);align-items:center;justify-content:center;font-size:calc(var(--u)*1.1);color:var(--txt);text-shadow:0 0 6px #000;transition:opacity .6s}
#tip .k{font-family:'Noto Serif JP',serif;color:var(--red);font-size:calc(var(--u)*1.6)}
#tip.off{opacity:0}

.info{position:absolute;bottom:3.2%;font-size:calc(var(--u)*1);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-shadow:0 0 6px #000;line-height:1.7}
.info b{color:var(--txt);font-weight:500}
#left{left:2.2%}#right{right:2.2%;text-align:right}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="background.jpg" alt="">
  <canvas id="petals"></canvas>
  <div id="vig"></div>

  <div id="plate">
    <svg class="swirl l" viewBox="0 0 40 40"><g fill="none" stroke="#ff2a2a" stroke-width="3.2" stroke-linecap="round"><path d="M20 6c8 0 14 6 14 14s-6 13-13 13-11-5-11-11 5-9 10-9 8 4 8 8-3 6-6 6"/><path d="M20 6c-3 0-6 1-8 3"/></g></svg>
    <div id="track"><div id="fill"></div></div>
    <svg class="swirl r" viewBox="0 0 40 40"><g fill="none" stroke="#ff2a2a" stroke-width="3.2" stroke-linecap="round"><path d="M20 6c8 0 14 6 14 14s-6 13-13 13-11-5-11-11 5-9 10-9 8 4 8 8-3 6-6 6"/><path d="M20 6c-3 0-6 1-8 3"/></g></svg>
  </div>

  <div id="status">Connexion au serveur…</div>
  <div id="file"></div>
  <div id="tip"><span class="k">忍</span><span id="tiptxt"></span></div>

  <div class="info" id="left">Carte · AKHNRP_MAP<b id="">—</b><br>Mode de jeu · <b id="gm">—</b></div>
  <div class="info" id="right">Slots · <b id="slots">—</b><br><b id="srv">AKH NRP</b></div>
</div>

<script>
// ---------------- CONFIG ----------------
var TIPS = [
  "Maintiens G, immobile, pour concentrer ton chakra.",
  "Touche B : active ou range le mode combat. Les touches 1 à 5 lancent tes techniques.",
  "F7 : menu des techniques — F8 : inventaire — F6 : menu admin.",
  "Ton affinité de chakra est tirée au sort à la création du personnage.",
  "Joue ton rôle : ton personnage ne sait que ce qu’il a vu ou appris.",
  "Plus ton niveau monte, plus tu débloques de techniques."
];
var TIP_DELAY = 6500;      // ms entre deux astuces
var DEMO_AFTER = 1300;     // ms : si GMod n’appelle rien, on lance l’aperçu animé
// ----------------------------------------

var $ = function(id){return document.getElementById(id)};
var total = 0, needed = 0, target = 0, shown = 0, gmod = false;

function setU(){ $('stage').style.setProperty('--u', ($('stage').clientWidth/100)+'px'); }
window.addEventListener('resize', setU); setU();

function render(){
  var pct = Math.round(shown*100);
  $('fill').style.width = (shown*100)+'%';
  var done = total ? (total-needed) : 0;
  $('status').innerHTML = (total && needed>0) ? 'Téléchargement des fichiers <b>'+done+' / '+total+'</b> · <b>'+pct+'%</b>' : ($('status').dataset.msg || 'Connexion au serveur…');
}
(function loop(){ shown += (target-shown)*0.06; if(Math.abs(target-shown)<0.0005) shown=target; if(total && needed>0) render(); requestAnimationFrame(loop); })();

// ---- API appelée par Garry’s Mod ----
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode){
  gmod = true;
  if(servername) $('srv').textContent = servername;
  $('map').textContent = mapname || '—';
  $('slots').textContent = maxplayers || '—';
  $('gm').textContent = gamemode || '—';
}
function SetFilesTotal(t){ total = +t || 0; update(); }
function SetFilesNeeded(n){ needed = +n || 0; update(); }
function update(){ target = total ? Math.min(1, Math.max(0, (total-needed)/total)) : 0; render(); }
function DownloadingFile(f){ $('file').textContent = (f||'').split('/').pop(); }
function SetStatusChanged(s){
  var m = s || '';
  if(/workshop/i.test(m)) m = 'Téléchargement du Workshop…';
  else if(/lua/i.test(m)) m = 'Chargement des scripts…';
  else if(/client info/i.test(m)) m = 'Envoi des informations…';
  else if(/Sending|Starting|Connected/i.test(m)) m = 'Connexion en cours…';
  else if(/Loading|Precach/i.test(m)) m = 'Préparation du monde…';
  $('status').dataset.msg = m; render();
}

// ---- Astuces ----
var ti = 0;
function nextTip(){
  var t=$('tip'); t.classList.add('off');
  setTimeout(function(){ $('tiptxt').textContent = TIPS[ti++ % TIPS.length]; t.classList.remove('off'); }, 600);
}
nextTip(); setInterval(nextTip, TIP_DELAY);

// ---- Pétales / feuilles ----
var cv=$('petals'), cx=cv.getContext('2d'), P=[];
function sizeCv(){ cv.width=cv.clientWidth; cv.height=cv.clientHeight; }
window.addEventListener('resize', sizeCv); sizeCv();
for(var i=0;i<38;i++) P.push({x:Math.random(),y:Math.random(),s:.6+Math.random()*1.4,v:.0004+Math.random()*.0009,d:(Math.random()-.5)*.0004,r:Math.random()*6.28,w:(Math.random()-.5)*.02});
(function petals(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(var i=0;i<P.length;i++){ var p=P[i];
    p.y+=p.v; p.x+=p.d+Math.sin(p.y*9+i)*.0004; p.r+=p.w;
    if(p.y>1.05){p.y=-.05;p.x=Math.random();}
    cx.save(); cx.translate(p.x*cv.width,p.y*cv.height); cx.rotate(p.r);
    var u=cv.width/100*p.s*.7;
    cx.fillStyle='rgba(255,'+(40+i%3*20)+','+(40+i%3*15)+','+(.35+p.s*.2)+')';
    cx.beginPath(); cx.ellipse(0,0,u,u*.45,0,0,6.283); cx.fill(); cx.restore();
  }
  requestAnimationFrame(petals);
})();

// ---- Aperçu animé (uniquement hors de Garry’s Mod) ----
setTimeout(function(){
  if(gmod) return;
  GameDetails('AKH NRP','','akhnrp_map',128,'','naruto_rp');
  var files=['materials/narutorp/effects/katon/fire_tornado.vtf','sound/futon/futon_3.wav','models/dragon.mdl','particles/big_tornado.pcf','materials/nrt/hud/portrait_default.png','sound/doton/doton_2.wav','maps/rp_konoha_v2.bsp'];
  var msgs=['Envoi des informations…','Téléchargement du Workshop…','Chargement des scripts…'];
  function run(){
    var T=48, n=T; total=0; needed=0; target=0; shown=0; $('file').textContent='';
    SetStatusChanged(msgs[0]);
    setTimeout(function(){ SetFilesTotal(T); SetFilesNeeded(T);
      var iv=setInterval(function(){
        n-=1+Math.floor(Math.random()*2); if(n<0)n=0;
        SetFilesNeeded(n); DownloadingFile(files[Math.floor(Math.random()*files.length)]);
        if(n===0){ clearInterval(iv); SetStatusChanged(msgs[2]); setTimeout(run,3500); }
      },320);
    },1400);
  }
  run();
}, DEMO_AFTER);
</script>
</body>
</html>
